name: Nanvix CI

on:
  schedule:
    - cron: "0 11 * * *"
  push:
    branches: ["nanvix/**"]
  pull_request:
    branches: ["nanvix/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref || 'default' }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v2.5.0
    with:
      platforms: '["microvm"]'
      process-modes: '["standalone"]'
      memory-sizes: '["128mb","256mb"]'
      windows-matrix-exclude: '[]'
      skip-full-test-modes: '[]'
      caller-event-name: ${{ github.event_name }}
      windows-test: true
      python-paths: ".nanvix/z.py .nanvix/_test.py"
      test-output-globs: '["**/*.elf","**/*.so","**/busybox.links","**/busybox.config"]'
      docker-image: "ghcr.io/nanvix/nanvix-sdk-c-clang:v0.19.17-sdk.2"
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  ci-scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v2.5.0
    with:
      platforms: '["microvm"]'
      process-modes: '["standalone"]'
      memory-sizes: '["128mb","256mb"]'
      windows-matrix-exclude: '[]'
      skip-full-test-modes: '[]'
      caller-event-name: 'schedule'
      windows-test: true
      python-paths: ".nanvix/z.py .nanvix/_test.py"
      test-output-globs: '["**/*.elf","**/*.so","**/busybox.links","**/busybox.config"]'
      docker-image: "ghcr.io/nanvix/nanvix-sdk-c-clang:v0.19.17-sdk.2"
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
